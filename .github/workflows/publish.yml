# Builds all eight jars and publishes Remnants | Skills and Powers to Modrinth + CurseForge on version tags.
# One Modrinth version and one CurseForge file per loader and Minecraft version (see scripts/upload_platforms.mjs).
#
# Secrets:   MODRINTH_TOKEN, CURSEFORGE_TOKEN
# Variables: MODRINTH_ID, CURSEFORGE_ID (optional; defaults live in scripts/release_metadata.mjs)
#
# Usage:     git tag v2.0.0 && git push --tags
#            or run the workflow manually with a version (dry_run=true previews without uploading).
#            To resend files one platform rejected, run it manually with `platforms` and `targets`,
#            for example platforms=curseforge, targets=forge:1.20.1,neoforge:26.3.

name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version (without v) when not tagging
        required: false
      dry_run:
        description: Build and preview the uploads without publishing
        required: false
        default: "false"
      platforms:
        description: both, modrinth or curseforge
        required: false
        default: "both"
      targets:
        description: Only these loader:minecraft targets, comma separated (empty = all eight)
        required: false
        default: ""

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version }}" ]]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "Provide a v*.*.* tag or a workflow_dispatch version" >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            25
            21

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Test release scripts
        run: node --test scripts/upload_platforms.test.mjs

      # The root build runs each version's own wrapper with the JDK named by its java_version
      # (17 for 1.20.1, 21 for 1.21.1, 25 for 26.2 and 26.3). `check` includes the core regression suite.
      - name: Build all versions
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
          JAVA_HOME_17: ${{ env.JAVA_HOME_17_X64 }}
          JAVA_HOME_21: ${{ env.JAVA_HOME_21_X64 }}
          JAVA_HOME_25: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          chmod +x gradlew 1.20.1/gradlew 1.21.1/gradlew 26.2/gradlew 26.3/gradlew
          ./gradlew buildAll --no-daemon
          ls -la all-jars

      - name: Resolve upload options
        id: opts
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          TARGETS: ${{ inputs.targets }}
        run: |
          args=()
          case "${PLATFORMS:-both}" in
            both) ;;
            modrinth) args+=(--modrinth-only) ;;
            curseforge) args+=(--curseforge-only) ;;
            *) echo "platforms must be both, modrinth or curseforge" >&2; exit 1 ;;
          esac
          TARGETS="${TARGETS// /}"
          if [[ -n "$TARGETS" ]]; then args+=(--targets "$TARGETS"); else args+=(--require-all-targets); fi
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"

      - name: Preview uploads
        run: node scripts/upload_platforms.mjs --version "${{ steps.ver.outputs.version }}" ${{ steps.opts.outputs.args }} --dry-run

      - name: Upload to Modrinth + CurseForge
        if: ${{ inputs.dry_run != 'true' }}
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID }}
        run: node scripts/upload_platforms.mjs --version "${{ steps.ver.outputs.version }}" ${{ steps.opts.outputs.args }}
